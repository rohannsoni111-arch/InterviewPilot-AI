name: InterviewPilot AI — Container Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-containers:
    name: Build & Package Production Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Tag Version
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and Tag Images
        run: |
          docker build -t interviewpilot/backend:${{ steps.vars.outputs.tag }} -f backend/Dockerfile .
          docker build -t interviewpilot/frontend:${{ steps.vars.outputs.tag }} -f frontend/Dockerfile .
          docker build -t interviewpilot/ai-service:${{ steps.vars.outputs.tag }} -f ai-service/Dockerfile .
