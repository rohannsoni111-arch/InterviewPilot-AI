name: InterviewPilot AI — Continuous Integration

on:
  push:
    branches: [master, main, 'release/**']
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: AI Microservice Testing (Python 3.10 + Pytest)
  # -------------------------------------------------------------
  ai-service-tests:
    name: AI Microservice (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pydantic-settings python-dotenv python-multipart httpx pytest pytest-asyncio

      - name: Run Pytest Suite
        run: pytest -v --tb=short

  # -------------------------------------------------------------
  # Job 2: Backend API Testing (Node 20 + Jest + In-Memory Mongo)
  # -------------------------------------------------------------
  backend-tests:
    name: Backend API (Jest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types Package
        run: npm --workspace=shared run build

      - name: Run Backend Jest Test Suites
        run: npm --workspace=backend test

  # -------------------------------------------------------------
  # Job 3: Frontend Component Testing (Node 20 + Vitest)
  # -------------------------------------------------------------
  frontend-tests:
    name: Frontend SPA (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types Package
        run: npm --workspace=shared run build

      - name: Run Frontend Vitest Component Suites
        run: npm --workspace=frontend test

  # -------------------------------------------------------------
  # Job 4: Full Monorepo Compilation Verification
  # -------------------------------------------------------------
  monorepo-build:
    name: Monorepo Compilation (Shared + Backend + Frontend)
    runs-on: ubuntu-latest
    needs: [ai-service-tests, backend-tests, frontend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Monorepo Workspaces
        run: npm run build

  # -------------------------------------------------------------
  # Job 5: Docker Containerization Build Validation
  # -------------------------------------------------------------
  docker-build:
    name: Docker Containerization Build Check
    runs-on: ubuntu-latest
    needs: [monorepo-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: interviewpilot-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: interviewpilot-frontend:ci-check

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ai-service/Dockerfile
          push: false
          tags: interviewpilot-ai-service:ci-check
