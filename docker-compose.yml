version: '3.8'

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0-jammy
    container_name: interviewpilot-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: interviewpilot
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interviewpilot-net

  # 2. Redis Cache
  redis:
    image: redis:7-alpine
    container_name: interviewpilot-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interviewpilot-net

  # 3. AI Microservice (FastAPI)
  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: interviewpilot-ai-service
    restart: always
    environment:
      - APP_NAME=InterviewPilot AI Service
      - PORT=8000
      - HOST=0.0.0.0
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - '8000:8000'
    networks:
      - interviewpilot-net

  # 4. Backend API (Node / Express / TypeScript)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: interviewpilot-backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/interviewpilot
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-interviewpilot_super_secret_jwt_access_key_2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-interviewpilot_super_secret_jwt_refresh_key_2026}
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=http://localhost:3000
    ports:
      - '5000:5000'
    networks:
      - interviewpilot-net

  # 5. Frontend UI (Nginx / React SPA)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: interviewpilot-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - '3000:80'
    networks:
      - interviewpilot-net

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  interviewpilot-net:
    driver: bridge
